name: Test and republish

# Runs when code, design or sources change. Re-renders the stored editions
# without fetching news or calling Claude, and deploys them. It never commits:
# the daily run is the only writer, so the two can't race.
on:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pline-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always deploy the newest main, not the commit that triggered this run:
      # a daily edition may have landed meanwhile, and an older checkout would
      # put yesterday's page back online.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pline render
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
